# Authentication Configuration
# Configuration for the Neuron CMS authentication system
#
# Loaded by the CMS at boot, underneath neuron.yaml: a key set in neuron.yaml
# or config/environments/<env>.yaml overrides the same key here.

auth:
  # Roles allowed into /admin. The `admin` route filter redirects anonymous
  # visitors to login and answers 403 to any signed-in user whose role is not
  # listed (subscribers). Authors are included because the Posts, Pages and
  # Events screens already limit them to their own content.
  admin_roles:
    - admin
    - editor
    - author

  # Session configuration
  session:
    lifetime: 120  # Session lifetime in minutes (2 hours)
    expire_on_close: false  # true: the session ends when the browser closes
    cookie_name: neuron_session
    cookie_httponly: true
    cookie_secure: auto  # auto (secure on HTTPS requests), true or false
    cookie_samesite: Lax  # Lax, Strict, or None (None needs a secure cookie)

  # Remember me configuration
  remember:
    enabled: true
    lifetime: 43200  # 30 days in minutes

  # Password configuration
  passwords:
    min_length: 8
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_special_chars: false
    hash_algorithm: argon2id  # argon2id or bcrypt; old hashes upgrade at next login

  # Login throttling (brute force protection). Failed logins are counted per
  # account; after max_attempts the account is locked for lockout_duration.
  # enabled: false stops counting and ignores existing lockouts.
  throttle:
    enabled: true
    max_attempts: 5  # Max failed attempts before lockout
    lockout_duration: 15  # Lockout duration in minutes

# Member Portal Configuration
member:
  # Registration settings
  registration_enabled: true  # Enable/disable public user registration
  require_email_verification: true  # Require email verification before account activation
  default_role: subscriber  # Default role for new members

  # Email verification settings
  verification_token_expiration_minutes: 60  # Token validity in minutes
  verification_url: /verify-email  # Verification endpoint URL
  resend_throttle_seconds: 60  # Minimum time between resend requests
